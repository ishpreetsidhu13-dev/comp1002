<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avengers Endgame Movie Poster</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Roboto:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>

        margin: 0;
        padding: 0;
        height: 100%;
        font-family: 'Roboto', sans-serif;
        color: white;
        background-color: black;
        background-image: url('images/avengers-endgame-poster.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;

        background: rgba(3,3,18,0.85);

    }
    main {
        background: rgba(0, 0, 0, 0.7);
        padding: 2rem 2.5rem;
        border-radius: 12px;
        box-shadow: 0 0 20px;
        max-width: 720px;
    }
    header h1{
        font-family: 'Anton', sans-serif;
        font-weight: 400;
        font-size: 3.5rem;
        letter-spacing: 0.2rem;
        margin: 0 0 1rem 0;

        text-transform: uppercase;

    }
